lsm.siteSettings.title=Mapeamento de URL por idioma
lsm.siteSettings.description=Associe a cada idioma do site o URL de base que deve servi-lo: um esquema e um nome de host, com porta se n\u00e3o for a predefinida. Quando um idioma tem um mapeamento, o menu de troca de idioma aponta para a mesma p\u00e1gina nesse URL, e um visitante que pede esse idioma noutro dom\u00ednio \u00e9 redirecionado para l\u00e1. Os idiomas sem mapeamento mant\u00eam o URL predefinido do site.
lsm.siteSettings.field.label=URL de base para o idioma:
lsm.siteSettings.field.rejected=Recusado: este campo n\u00e3o foi alterado. Indique um esquema e um nome de host, por exemplo https://www.example.fr
lsm.siteSettings.help=Formato esperado: https://www.example.fr ou http://example.fr:8080. Apenas http e https s\u00e3o aceites; um caminho, uma query string ou credenciais s\u00e3o recusados. Deixe um campo vazio para manter o URL predefinido do site para esse idioma.
