lsm.menu.ariaLabel=Change language

lsm.siteSettings.title=Language URL mapping
lsm.siteSettings.description=Map each site language to the base URL that should serve it: a scheme and a hostname, with a port if it is not the default. When a language has a mapping, the language switch menu links to the same page on that URL, and a visitor asking for that language on another domain is redirected there. Languages without a mapping keep the default site URL.
lsm.siteSettings.field.label=Base URL for language:
lsm.siteSettings.field.rejected=Rejected: this field was left unchanged. Give a scheme and a hostname, for example https://www.example.fr
lsm.siteSettings.help=Expected format: https://www.example.fr or http://example.fr:8080. Only http and https are accepted; a path, a query string or credentials are refused. Leave a field empty to keep the default site URL for that language.
lsm.label.save=Save
lsm.siteSettings.saved=Settings saved.
lsm.siteSettings.error=Could not save settings.
lsm.siteSettings.legend=Base URL per language
lsm.siteSettings.saving=Saving\u2026
