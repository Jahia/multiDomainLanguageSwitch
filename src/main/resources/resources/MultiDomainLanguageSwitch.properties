lsm.siteSettings.title=Language URL mapping
lsm.siteSettings.description=Map each site language to the base URL (scheme and hostname, with an optional base path) that should serve it. When a language has a mapping, the language switch menu links to the same page on that URL. Languages without a mapping keep the default site URL.
lsm.siteSettings.field.label=Base URL for language:
lsm.siteSettings.help=Expected format: https://www.example.fr (http or https only). Leave a field empty to keep the default site URL for that language.
lsm.label.save=Save
lsm.siteSettings.saved=Settings saved.
lsm.siteSettings.error=Could not save settings.
