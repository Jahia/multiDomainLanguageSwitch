lsm.siteSettings.title=Mappatura URL per lingua
lsm.siteSettings.description=Associa a ogni lingua del sito l'URL di base che deve servirla: uno schema e un nome host, con la porta se non \u00e8 quella predefinita. Quando una lingua ha una mappatura, il menu di cambio lingua rimanda alla stessa pagina su quell'URL e un visitatore che richiede quella lingua su un altro dominio viene reindirizzato. Le lingue senza mappatura mantengono l'URL predefinito del sito.
lsm.siteSettings.field.label=URL di base per la lingua:
lsm.siteSettings.field.rejected=Rifiutato: questo campo non \u00e8 stato modificato. Indica uno schema e un nome host, per esempio https://www.example.fr
lsm.siteSettings.help=Formato previsto: https://www.example.fr oppure http://example.fr:8080. Sono accettati solo http e https; un percorso, una query string o le credenziali vengono rifiutati. Lascia un campo vuoto per mantenere l'URL predefinito del sito per quella lingua.
