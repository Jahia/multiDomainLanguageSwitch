lsm.siteSettings.title=Sprach-URL-Zuordnung
lsm.siteSettings.description=Ordnen Sie jeder Sprache der Website die Basis-URL zu, die sie ausliefern soll: ein Schema und ein Hostname, mit Port, falls dieser nicht der Standard ist. Hat eine Sprache eine Zuordnung, verweist das Sprachumschaltmen\u00fc auf dieselbe Seite unter dieser URL, und ein Besucher, der diese Sprache auf einer anderen Domain anfordert, wird dorthin umgeleitet. Sprachen ohne Zuordnung behalten die Standard-URL der Website.
lsm.siteSettings.field.label=Basis-URL f\u00fcr die Sprache:
lsm.siteSettings.field.rejected=Abgelehnt: dieses Feld bleibt unver\u00e4ndert. Geben Sie ein Schema und einen Hostnamen an, zum Beispiel https://www.example.fr
lsm.siteSettings.help=Erwartetes Format: https://www.example.fr oder http://example.fr:8080. Nur http und https werden akzeptiert; ein Pfad, ein Query-String oder Anmeldedaten werden abgelehnt. Lassen Sie ein Feld leer, um f\u00fcr diese Sprache die Standard-URL der Website zu behalten.
lsm.label.save=Speichern
lsm.siteSettings.saved=Einstellungen gespeichert.
lsm.siteSettings.error=Einstellungen konnten nicht gespeichert werden.
lsm.siteSettings.legend=Basis-URL pro Sprache
lsm.siteSettings.saving=Wird gespeichert\u2026
