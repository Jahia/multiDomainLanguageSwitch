lsm.siteSettings.description=Ordnen Sie jeder Sprache der Website die Basis-URL (Schema und Hostname, optionaler Basispfad) zu, die sie ausliefern soll. Hat eine Sprache eine Zuordnung, verweist das Sprachwechsel-Men\u00fc auf dieselbe Seite unter dieser URL. Sprachen ohne Zuordnung behalten die Standard-URL der Website.
