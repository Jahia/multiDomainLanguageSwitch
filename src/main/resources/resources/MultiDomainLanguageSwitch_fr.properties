lsm.menu.ariaLabel=Changer de langue

lsm.siteSettings.title=Mapping URL par langue
lsm.siteSettings.description=Associez \u00e0 chaque langue du site l'URL de base qui doit la servir : un sch\u00e9ma et un nom d'h\u00f4te, avec un port s'il n'est pas celui par d\u00e9faut. Quand une langue a un mapping, le menu de changement de langue pointe vers la m\u00eame page sur cette URL, et un visiteur qui demande cette langue sur un autre domaine y est redirig\u00e9. Les langues sans mapping conservent l'URL par d\u00e9faut du site.
lsm.siteSettings.field.label=URL de base pour la langue :
lsm.siteSettings.field.rejected=Refus\u00e9 : ce champ n'a pas \u00e9t\u00e9 modifi\u00e9. Indiquez un sch\u00e9ma et un nom d'h\u00f4te, par exemple https://www.example.fr
lsm.siteSettings.help=Format attendu : https://www.example.fr ou http://example.fr:8080. Seuls http et https sont accept\u00e9s ; un chemin, une cha\u00eene de requ\u00eate ou des identifiants sont refus\u00e9s. Laissez un champ vide pour conserver l'URL par d\u00e9faut du site pour cette langue.
lsm.label.save=Enregistrer
lsm.siteSettings.saved=Param\u00e8tres enregistr\u00e9s.
lsm.siteSettings.error=Impossible d'enregistrer les param\u00e8tres.
lsm.siteSettings.legend=URL de base par langue
lsm.siteSettings.saving=Enregistrement\u2026
