lsm.siteSettings.description=Associez \u00e0 chaque langue du site l'URL de base (sch\u00e9ma et nom d'h\u00f4te, chemin de base optionnel) qui doit la servir. Quand une langue a un mapping, le menu de changement de langue pointe vers la m\u00eame page sur cette URL. Les langues sans mapping conservent l'URL par d\u00e9faut du site.
