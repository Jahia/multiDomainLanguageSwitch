lsm.siteSettings.title=Asignaci\u00f3n de URL por idioma
lsm.siteSettings.description=Asocie a cada idioma del sitio la URL base que debe servirlo: un esquema y un nombre de host, con puerto si no es el predeterminado. Cuando un idioma tiene una asignaci\u00f3n, el men\u00fa de cambio de idioma enlaza a la misma p\u00e1gina en esa URL, y un visitante que solicita ese idioma en otro dominio es redirigido all\u00ed. Los idiomas sin asignaci\u00f3n conservan la URL predeterminada del sitio.
lsm.siteSettings.field.label=URL base para el idioma:
lsm.siteSettings.field.rejected=Rechazado: este campo no se ha modificado. Indique un esquema y un nombre de host, por ejemplo https://www.example.fr
lsm.siteSettings.help=Formato esperado: https://www.example.fr o http://example.fr:8080. Solo se aceptan http y https; una ruta, una cadena de consulta o credenciales se rechazan. Deje un campo vac\u00edo para conservar la URL predeterminada del sitio para ese idioma.
lsm.label.save=Guardar
lsm.siteSettings.saved=Configuraci\u00f3n guardada.
lsm.siteSettings.error=No se pudo guardar la configuraci\u00f3n.
lsm.siteSettings.legend=URL base por idioma
lsm.siteSettings.saving=Guardando\u2026
